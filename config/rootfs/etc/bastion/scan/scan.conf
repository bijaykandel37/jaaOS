# BastionOS — bastion-scan defaults (Phase 6). Parsed as KEY=value.
# The ENGAGEMENT file (not this file) is the authority on scope and authorization; this only
# sets where things live and which container image to run.

# Pinned VAPT image. Build it with:  bastion-scan is driven by the Containerfile under
#   packages/bastion-scan/containers/Containerfile.vapt
# Pin by digest in production (localhost/bastionos/vapt@sha256:...) once built and signed.
IMAGE=localhost/bastionos/vapt:pinned

# Append-only audit log. Harden on a real host with:  chattr +a /var/log/bastion-scan/audit.log
AUDIT_LOG=/var/log/bastion-scan/audit.log

# Where container results are written (bind-mounted to /out, read-write).
RESULTS_DIR=/var/lib/bastion-scan/results
