# BastionOS: give each login session a FRESH tmpfs /tmp and /var/tmp, destroyed at logout.
# Because switching environments requires a full logout, nothing a user writes to /tmp in
# one environment survives into the other. (pam_namespace keys by user, but the tmpfs
# instance is torn down at session end, so the scrubbing — not per-env keying — is what
# isolates the two environments.) root is exempt so system services are unaffected.
#
# <polydir>  <instance_prefix>  <method>  <list_of_uids(=exempt with '~')>
/tmp      /tmp      tmpfs  root
/var/tmp  /var/tmp  tmpfs  root
