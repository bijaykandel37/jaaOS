# BastionOS swap: zram only (RAM-backed, ephemeral, never written to disk).
# This replaces disk swap by default so that no decrypted/plaintext pages ever
# persist — important for the deniability model. Hibernation is disabled accordingly.
# A LUKS random-key disk-swap partition is an opt-in installer choice (Phase 3).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
