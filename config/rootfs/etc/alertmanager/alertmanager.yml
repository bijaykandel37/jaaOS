### BastionOS — Alertmanager configuration (Phase 5, "full" mode only).
#
# HONEST DEFAULT: no external destination is wired. Out of the box, alerts are grouped and
# held locally — Alertmanager's own UI/API (127.0.0.1:9093) and `bastion-health alerts` are
# how you see them. We ship NO email/Slack/webhook credentials, because a distro must not
# guess your infrastructure. Uncomment and fill ONE receiver below to actually get notified.
#
# Like everything else in this stack, Alertmanager binds locally only; reach it via SSH tunnel.

global:
  resolve_timeout: 5m

route:
  receiver: local-default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: local-default
      repeat_interval: 1h

receivers:
  # Default sink: no notification channel. Alerts are still visible in the UI/API.
  - name: local-default

  # --- Example receivers. Pick one, uncomment, and set `route.receiver` above. ---
  #
  # - name: email
  #   email_configs:
  #     - to: "ops@example.com"
  #       from: "bastion@example.com"
  #       smarthost: "smtp.example.com:587"
  #       auth_username: "bastion@example.com"
  #       auth_password: "CHANGE_ME"     # better: use auth_password_file
  #
  # - name: webhook
  #   webhook_configs:
  #     - url: "http://127.0.0.1:9000/alert"   # your own forwarder/bridge

inhibit_rules:
  # A critical alert silences the matching warning for the same target.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname", "instance"]
