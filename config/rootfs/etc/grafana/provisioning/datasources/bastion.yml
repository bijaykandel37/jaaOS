### BastionOS — Grafana datasource provisioning (Phase 5, "full" mode).
# Auto-wires the local Prometheus and Loki so dashboards work on first boot with no clicks.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: bastion-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: bastion-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    # Present only in full mode; harmless if Loki is not running.
