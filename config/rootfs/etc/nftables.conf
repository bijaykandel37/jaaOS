#!/usr/sbin/nft -f
# BastionOS base firewall: default-deny inbound, allow established + loopback + SSH.
# `bastion fw open <port>` (later phase) edits the bastion-managed set below.

flush ruleset

table inet filter {
	# Ports opened by the bastion CLI get added to this set.
	set bastion_tcp_open {
		type inet_service
		flags interval
		elements = { 22 }
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iif "lo" accept

		# ICMP / ICMPv6 (needed for PMTUD, ND); rate-limited
		ip protocol icmp limit rate 10/second accept
		ip6 nexthdr ipv6-icmp accept

		# Managed open TCP ports (SSH by default)
		tcp dport @bastion_tcp_open ct state new accept

		# Everything else inbound is logged (rate-limited) and dropped by policy.
		limit rate 5/minute log prefix "nft-drop-in: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		# Container/VM forwarding rules are added by Podman/CNI in their own tables.
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# Ports opened at runtime by bastion-host (adds elements to bastion_tcp_open above).
include "/etc/nftables.d/bastion-host.nft"
