#!/usr/sbin/nft -f
# jaaOS base firewall: default-deny inbound, allow established + loopback + SSH.
# `jaa fw open <port>` (later phase) edits the jaa-managed set below.

flush ruleset

table inet filter {
	# TCP ports open to everyone. jaa-host / `jaa apply` add one rule per port here.
	# A chain of plain rules, NOT a named set: the older nft inside Calico (RKE2's canal CNI)
	# segfaults on any named set created by Debian's nft, which breaks Kubernetes networking.
	chain jaa_tcp_open {
		tcp dport 22 ct state new accept
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
		iif "lo" accept

		# ICMP / ICMPv6 (needed for PMTUD, ND); rate-limited
		ip protocol icmp limit rate 10/second accept
		meta l4proto icmpv6 accept

		# Managed open TCP ports (SSH by default)
		jump jaa_tcp_open

		# Kubernetes ports, LAN only (filled by jaa-cluster; empty when the role is "none").
		jump jaa_cluster_in

		# Everything else inbound is logged (rate-limited) and dropped by policy.
		limit rate 5/minute log prefix "nft-drop-in: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		# A drop here is final even if Docker/Kubernetes accept the packet in their own tables,
		# so container traffic has to be allowed here explicitly.
		ct state invalid drop
		ct state established,related accept
		# Published container ports and Kubernetes Services/NodePorts arrive DNATed by Docker or
		# kube-proxy. NOTE: like on any Docker host, `docker run -p` exposes a port to the network.
		ct status dnat accept
		# Outbound traffic from Docker bridges (default bridge + user-defined networks).
		iifname "docker0" accept
		iifname "br-*" accept
		jump jaa_cluster_fwd
	}

	# Filled by /etc/nftables.d/jaa-cluster.nft (jaa-cluster); reloaded on their own, so changing
	# the cluster role never flushes Docker's or Kubernetes' tables.
	chain jaa_cluster_in {
	}

	chain jaa_cluster_fwd {
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# Drop-ins: jaa-host.nft (ports opened by jaa-host) and jaa-cluster.nft (Kubernetes role).
include "/etc/nftables.d/*.nft"
