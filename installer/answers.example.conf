# Example unattended answer file for jaa-install (sourced as shell — keep it shell-safe).
#   sudo installer/tui/jaa-install --unattended installer/answers.example.conf
#
# DESTRUCTIVE: TARGET_DISK is wiped. CONFIRM_WIPE=yes is required for unattended runs.

CONFIRM_WIPE=yes
TARGET_DISK=/dev/vdb          # the disk to erase and install onto
PROFILE=server               # minimal | server | desktop | security-lab
HOSTNAME=jaa
USERNAME=admin

# Login password: unlocks your home environment (change these!)
USER_PW=change-this-login-password
# Disk-encryption passphrase: asked at every boot
FDE_PW=change-this-disk-passphrase

DUAL_ENV=yes                 # yes = separate encrypted home; add hidden envs later with jaa-env add
TPM2=no                      # yes requires a real TPM2 (not in a plain VM)
TPM2_PIN=
