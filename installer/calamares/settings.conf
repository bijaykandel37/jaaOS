# BastionOS Calamares configuration (graphical installer).
# Uses Calamares' BUILT-IN modules plus a shellprocess hook — no custom C++ module (ADR 0002:
# keep custom logic in our scripts). Exercised on the live ISO in Phase 7.
---
modules-search: [ local ]

instances:
- id: bastion
  module: shellprocess
  config: shellprocess-bastion.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition        # includes LUKS: creates the single (declarable) encrypted volume
  - users
  - packagechooser   # profile selection -> packages module
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - packages
  - shellprocess@bastion
  - bootloader
  - umount
- show:
  - finished

branding: bastionos
prompt-install: true
dont-chroot: false
