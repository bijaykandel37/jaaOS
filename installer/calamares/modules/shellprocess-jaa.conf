# jaaOS post-install hook, run by Calamares in the target root.
---
dontChroot: false
timeout: 600
script:
    # Representative finalization. NOTE: the dual-password home needs the login password, which
    # Calamares holds in the users module; passing it securely to `jaa-env init` needs a
    # small custom module (TODO Phase 7). Until then, the complete dual-env path is the TUI
    # installer (installer/tui/jaa-install). Enabling it here without that plumbing would be
    # dishonest, so we don't.
    - "systemctl enable snapper-cleanup.timer || true"
    - "command -v update-initramfs >/dev/null && update-initramfs -u || true"
