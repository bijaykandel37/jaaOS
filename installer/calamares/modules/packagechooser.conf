# BastionOS profile selection in the graphical installer. The chosen id is handed to the
# `packages` module (which installs the matching bastionos-profile-* meta-package once the
# overlay repo exists — Phase 7; until then map these to the build/profiles/*.packages lists).
---
mode: required
method: legacy
id: profile

items:
- id: minimal
  name: "Minimal"
  description: "Base system, SSH (key-only), firewall, CLI tools. No GUI."
  screenshot: ""
- id: server
  name: "Server"
  description: "Minimal + rootless containers + monitoring base. Hosting/LB in later updates."
  screenshot: ""
- id: desktop
  name: "Desktop"
  description: "GNOME on Wayland, Flatpak/bubblewrap sandboxing."
  screenshot: ""
- id: security-lab
  name: "Security Lab"
  description: "Desktop + containerized VAPT tooling (authorized testing only)."
  screenshot: ""
