# BastionOS engagement file — AUTHORIZED TESTING ONLY.
#   cp this to ./engagement.conf (or point BASTION_SCAN_ENGAGEMENT at it), fill it in, then:
#     bastion-scan engagement validate
#     bastion-scan scope check app.example.com 203.0.113.5     # dry gate, no scanning
#     bastion-scan run discovery 203.0.113.5
#
# This file is DATA — bastion-scan parses it, never sources it. bastion-scan REFUSES to run
# without AUTHORIZATION_REF and at least one scope entry. Keep it 0600; it records who said you
# could test what. The example values below use the RFC 5737 / RFC 2606 documentation ranges.

NAME=example-webapp-assessment

# REQUIRED. The authority you are relying on: statement of work, change ticket, or a reference
# to written authorization on file. No ref -> no scan. This is logged with every run.
AUTHORIZATION_REF=SOW-2026-014 (written authorization from the system owner on file)

OPERATOR=bijay

# Optional engagement window (UTC, ISO-8601). Outside it, runs are refused.
WINDOW_START=2026-10-01T00:00:00Z
WINDOW_END=2026-12-31T23:59:59Z

# Scope. Space-separated. A target must match one of these to be touched.
SCOPE_CIDRS=203.0.113.0/24 198.51.100.10/32
SCOPE_HOSTS=app.example.com api.example.com
SCOPE_DOMAINS=example.com          # also matches *.example.com

# Never touch these, even if they fall inside a scope entry above. Exclusions always win.
EXCLUDE=203.0.113.1 198.51.100.10

# Rate cap handed to the tools (e.g. nmap --max-rate, nuclei -rl). Keep it polite.
MAX_RATE_PPS=100

# Which profiles this engagement permits. Non-destructive assessment only.
ALLOW_PROFILES=discovery tls web
