# jaaOS WiFi engagement file — AUTHORIZED TESTING ONLY.
#   cp this to ./wifi-engagement.conf (or point JAA_WIFI_ENGAGEMENT at it), fill it in, then on
#   the phone in Termux:
#     jaa-wifi scope check "MyHomeWiFi"
#     jaa-wifi audit
#
# This file is DATA — jaa-wifi parses it, never sources it. jaa-wifi REFUSES to assess any network
# that is not in SCOPE_SSIDS / SCOPE_BSSIDS below. Testing a WiFi network you are not authorized to
# test is illegal in most countries (e.g. Computer Misuse / unauthorized-access laws). List only
# networks you OWN or have the owner's written permission to test. Keep this file 0600.

NAME=home-network-audit

# REQUIRED. Who said you could test these networks: for your own WiFi, "I own this network"; for a
# client, a statement of work or written authorization. No ref -> jaa-wifi refuses. Logged every run.
AUTHORIZATION_REF=I own this network (home)

OPERATOR=bijay

# Scope: the networks you may assess. A network must match one of these or it is NOT assessed.
#   SCOPE_SSIDS  — network names (exact). Quote names with spaces.
#   SCOPE_BSSIDS — access-point MACs (aa:bb:cc:dd:ee:ff). More precise than the name.
# Use BSSIDs when you can: an attacker can name a rogue AP the same as yours.
SCOPE_SSIDS="MyHomeWiFi" "MyHomeWiFi-5G"
SCOPE_BSSIDS=

# For jaa-net (LAN management): subnets you administer, e.g. 192.168.1.0/24. Optional; a network
# authorized by SSID/BSSID above is also authorized for jaa-net.
SCOPE_SUBNETS=

# Never assess these even if the name/MAC matches scope. Exclusions always win.
EXCLUDE_SSIDS=
EXCLUDE_BSSIDS=
